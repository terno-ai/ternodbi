# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io),
# which feeds GitHub's MCP Registry and VS Code's MCP gallery.
#
# GitHub OIDC proves this job runs in a terno-ai repo, which grants the
# io.github.terno-ai/* namespace without needing an org Owner's token.
# The version comes from pyproject.toml; the registry rejects duplicates.
name: Publish to MCP Registry

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync server.json version from pyproject.toml
        run: |
          python - <<'PY'
          import json, pathlib, tomllib

          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          path = pathlib.Path("server.json")
          doc = json.loads(path.read_text())

          doc["version"] = version
          for package in doc.get("packages", []):
              if package.get("identifier") == "terno-dbi":
                  package["version"] = version

          path.write_text(json.dumps(doc, indent=2) + "\n")
          print(f"server.json version set to {version}")
          PY

      - name: Check the version is on PyPI
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/terno-dbi/${version}/json")
          if [ "$code" != "200" ]; then
            echo "terno-dbi ${version} is not on PyPI (HTTP ${code})" >&2
            exit 1
          fi
          echo "terno-dbi ${version} found on PyPI"

      - name: Validate server.json against the MCP schema
        run: |
          python -m pip install --quiet jsonschema requests
          python - <<'PY'
          import json, requests, jsonschema

          doc = json.load(open("server.json"))
          schema = requests.get(doc["$schema"], timeout=30).json()
          jsonschema.validate(doc, schema)
          print("server.json is valid")
          PY

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Log in to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
